[package]
name = "dbayam-driver-sqlite"
description = "SQLite driver for DBayam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dbayam-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
# `column_decltype` exposes the declared column types of result columns
# (sqlite3_column_decltype), used to map values to DBayam kinds.
rusqlite = { workspace = true, features = ["column_decltype"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
hex.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true }
tempfile.workspace = true
