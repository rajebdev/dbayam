  <circle cx="470" cy="330" r="17" fill="#12222b"/>
  <circle cx="554" cy="330" r="17" fill="#12222b"/>
  <path d="M484 380 C 484 360, 540 360, 540 380 L 512 416 Z" fill="#f7a72e" stroke="#062f22" stroke-width="7" stroke-linejoin="round"/>
  <path d="M512 420 C 497 420, 488 429, 488 440 C 488 455, 499 464, 512 464 C 525 464, 536 455, 536 440 C 536 429, 527 420, 512 420 Z" fill="#d83a30" stroke="#062f22" stroke-width="7"/>

  <!-- The database. -->
  <g>
    <path d="M252 700 v158 a260 84 0 0 0 520 0 v-158 z" fill="url(#db)"/>
    <path d="M258 764 a254 78 0 0 0 508 0" fill="none" stroke="#0a4a58" stroke-width="18" opacity="0.4"/>
    <path d="M258 840 a254 78 0 0 0 508 0" fill="none" stroke="#0a4a58" stroke-width="18" opacity="0.4"/>
    <ellipse cx="512" cy="700" rx="260" ry="84" fill="url(#dbTop)"/>
    <ellipse cx="512" cy="700" rx="260" ry="84" fill="none" stroke="#0a4a58" stroke-width="18" opacity="0.4"/>
