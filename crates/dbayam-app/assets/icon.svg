  </g>
  <g stroke="#1a6b25" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M338 686 C 312 616, 274 546, 226 470"/>
    <path d="M686 686 C 712 616, 750 546, 798 470"/>
  </g>

  <!-- The chicken behind the database rim. -->
  <g stroke="#062f22" stroke-width="9" stroke-linejoin="round">
    <ellipse cx="512" cy="530" rx="158" ry="150" fill="url(#body)"/>
    <ellipse cx="376" cy="548" rx="52" ry="88" fill="url(#wing)" transform="rotate(-14 376 548)"/>
    <ellipse cx="648" cy="548" rx="52" ry="88" fill="url(#wing)" transform="rotate(14 648 548)"/>
    <circle cx="512" cy="332" r="102" fill="url(#body)"/>
    <path d="M450 240 C 438 194, 468 168, 494 194 C 496 158, 532 150, 542 180 C 558 148, 594 160, 590 198 C 618 182, 644 208, 620 242 C 600 272, 560 260, 530 260 C 500 260, 464 272, 450 240 Z" fill="url(#comb)"/>
